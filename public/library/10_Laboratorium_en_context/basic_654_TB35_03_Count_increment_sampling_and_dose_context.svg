<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="347" height="157" viewBox="-174 -24 347 157"><title>Count increment sampling and dose context</title><desc>Timing helps interpret response but does not by itself prove mechanism. No universal CCI cutoff or manufactured patient curve. Native editable vector; domain cartoons are not atomic models.</desc><defs>
