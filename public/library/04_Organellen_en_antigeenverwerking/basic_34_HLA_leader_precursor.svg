<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="780" height="700" viewBox="-195 -270 390 350"><title>HLA class I: attached N-terminal leader on heavy alpha chain</title><desc>Sequence-position cartoon using the standard folded HLA outline; not a literal simultaneous folding/assembly intermediate. Signal peptides are removed during ER biogenesis, not retained on mature surface HLA. No peptide is shown in the binding groove. Bead count is illustrative, not an allele sequence. The heavy-chain signal peptide is not attached to beta-2-microglobulin; beta-2-microglobulin is shown only as a familiar structural context.</desc><defs id="opt-soft-defs" /><defs>
