<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="154" height="162" viewBox="-77 -81 154 162"><title>Pre-escape: two distinct HLA haplotypes</title><desc>Schematic alternative escape routes, not proof from one skewed HLA-typing result. Confirm origin, tumor purity, copy number and expression independently. Native editable vector; domain cartoons are not atomic models.</desc><defs>
